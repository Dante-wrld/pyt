[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "solana-launch-guard"
version = "0.26.5"
description = "Multichain token monitor with guarded Solana buys and automatic sells"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "certifi>=2025.8.3",
  "websockets>=15,<17",
  "keyring>=25,<26",
  "solders>=0.29,<0.30",
  "openai>=2.0,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
robinhood = ["eth-account>=0.13,<0.14"]
dev = [
  "pytest>=8,<10",
  "eth-account>=0.13,<0.14",
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
]

[project.scripts]
launch-guard-robinhood = "solana_launch_guard.robinhood_setup:main"
launch-guard = "solana_launch_guard.app:main"
launch-guard-agents = "solana_launch_guard.agent_cli:main"
launch-guard-eval = "solana_launch_guard.eval_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["solana_launch_guard"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.env",
  "/.venv",
  "/.testvenv",
  "/.pytest_cache",
  "/.ruff_cache",
  "/build",
  "/dist",
  "/upload",
  "/**/*.db",
  "/launch_guard_portfolio.json",
  "/launch_guard_recommendations.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["solana_launch_guard", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["solana_launch_guard"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
