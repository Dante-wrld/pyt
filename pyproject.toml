[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "solana-launch-guard"
version = "0.10.0"
description = "Read-only multichain token monitor with decision alerts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "certifi>=2025.8.3",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
launch-guard = "solana_launch_guard.app:main"

[tool.hatch.build.targets.wheel]
packages = ["solana_launch_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
