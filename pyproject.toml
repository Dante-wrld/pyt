[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "solana-launch-guard"
version = "0.25.0"
description = "Multichain token monitor with guarded Solana buys and automatic sells"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "certifi>=2025.8.3",
  "websockets>=15,<17",
  "keyring>=25,<26",
  "solders>=0.29,<0.30",
  "openai>=2.0,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
launch-guard = "solana_launch_guard.app:main"
launch-guard-agents = "solana_launch_guard.agent_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["solana_launch_guard"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.env",
  "/.venv",
  "/.testvenv",
  "/.pytest_cache",
  "/.ruff_cache",
  "/build",
  "/dist",
  "/upload",
  "/**/*.db",
  "/launch_guard_portfolio.json",
  "/launch_guard_recommendations.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
